apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-copilot-backend
  labels:
    app: security-copilot
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: security-copilot
      component: backend
  template:
    metadata:
      labels:
        app: security-copilot
        component: backend
    spec:
      containers:
      - name: backend
        image: security-copilot-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: security-copilot-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: security-copilot-secrets
              key: secret-key
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: PROMETHEUS_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-copilot-frontend
  labels:
    app: security-copilot
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-copilot
      component: frontend
  template:
    metadata:
      labels:
        app: security-copilot
        component: frontend
    spec:
      containers:
      - name: frontend
        image: security-copilot-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: security-copilot-backend-service
spec:
  selector:
    app: security-copilot
    component: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: security-copilot-frontend-service
spec:
  selector:
    app: security-copilot
    component: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: security-copilot-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: security-copilot-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80