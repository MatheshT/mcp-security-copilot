name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Run backend unit tests
      run: |
        cd backend
        pytest --ignore=tests/test_wazuh_integration.py --cov=app --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        file: ./backend/coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run frontend tests
      run: |
        cd frontend
        npx vitest run --passWithNoTests
      env:
        CI: true

    - name: Build frontend production bundle
      run: |
        cd frontend
        npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build backend Docker image
      run: |
        docker build -t security-copilot-backend:${{ github.sha }} ./backend
        docker tag security-copilot-backend:${{ github.sha }} security-copilot-backend:latest
    
    - name: Build frontend Docker image
      run: |
        docker build -t security-copilot-frontend:${{ github.sha }} ./frontend
        docker tag security-copilot-frontend:${{ github.sha }} security-copilot-frontend:latest
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main' && secrets.DOCKER_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Push to Docker Hub
      if: github.ref == 'refs/heads/main' && secrets.DOCKER_USERNAME != ''
      run: |
        docker push security-copilot-backend:latest
        docker push security-copilot-frontend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.KUBE_CONFIG != ''
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Kubernetes
      uses: azure/k8s-deploy@v5
      with:
        manifests: |
          k8s-deployment.yaml
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
        namespace: production
