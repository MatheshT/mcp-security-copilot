version: '3.9'

services:
  backend:
    build:
      context: ./backend
    ports:
      - '8000:8000'
    environment:
      - DEFAULT_SECURITY_TOOLS=Wazuh,VirusTotal
      - LLM_PROVIDER=free
      - VITE_API_URL=http://localhost:8000
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
